name: Sync oarspac Package

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: "0 2 * * *"
  repository_dispatch:
    types: [oarspac-sync-event] # Accept upstream triggered events
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move current repository contents to a temporary location
        run: |
          mkdir temp-current-repo
          shopt -s extglob dotglob # enable extended globbing and include hidden files to support usage of !(pattern)
          mv !(temp-current-repo) temp-current-repo/
          mv temp-current-repo/.github .github
          mv temp-current-repo/.git .git

      - name: Clone source repository
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://${{ secrets.KEN_PAT }}@github.com/hfpg2026/legalfile.git temp-repo
          cd temp-repo
          git sparse-checkout set packages/oarspac

      - name: Sync oarspac folder to temporary current repository
        run: |
          # Sync the folder from cloned repo
          rsync -av --delete --exclude=.github/ --exclude=.git/ temp-repo/packages/oarspac/ temp-current-repo

      - name: Move contents back to current repository
        run: |
          mv temp-current-repo/* .

      - name: Clean up temporary repositories
        run: |
          rm -rf temp-repo
          rm -rf temp-current-repo

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Sync oarspac package from hfpg2026/legalfile - $TIMESTAMP"
            git push
          fi
