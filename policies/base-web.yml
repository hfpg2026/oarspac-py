description: OSS Licensing Policy for internal and public-facing projects
name: OSS Licensing Policy
version: "1.0"

# ---------------------
# Enforcement rules
# ---------------------
rules:
  - description: Deny strong copyleft licenses
    id: deny_strong_copyleft
    when:
      license:
        - GPL-2.0
        - GPL-3.0
        - AGPL-3.0
    then:
      action: deny
      message: "Strong copyleft licenses not allowed in internal codebase"
      remediation: "Use permissive licenses like MIT, Apache-2.0, or BSD"
      severity: error

  - description: Deny weak copyleft or context-specific licenses
    id: deny_weak_copyleft
    when:
      license:
        - LGPL-3.0
        - CDDL-1.0
        - CC-BY-SA-4.0
        - MPL-2.0
        - EUPL
        - Hippocratic-2.1
    then:
      action: deny
      message: "Weak copyleft or context-specific licenses require special review"
      remediation: "Use permissive licenses or request exception approval"
      severity: error

  - description: Allow permissive licenses without additional review
    id: allow_permissive
    when:
      license:
        - MIT
        - LicenseRef-MIT-No-False-Attribution
        - BSD-2-Clause
        - BSD-3-Clause
        - CC-BY-3.0
        - Apache-2.0
        - ISC
        - LicenseRef-JSON
        - WTFPL
        - Python-2.0.1
        - Zlib
        - W3C-20150513
    then:
      action: allow
      message: "Permissive licenses allowed"
      severity: info
      notes:
        - preserve_license_text
        - preserve_copyright_notices
        - preserve_warranty_disclaimer
        - include_attribution_in_distribution
        - no_endorsement_or_trademark_use
        - propagate_notice_file_if_present
        - document_modifications_if_any
        - comply_with_patent_termination_clause

  - description: Restrict licenses with SEM/legal review
    id: restrict_special
    when:
      license:
        - LGPL-2.1
        - BSD-4-Clause
        - EPL-2.0
        - OFL-1.1
    then:
      action: flag_for_review
      message: "Requires SEM/legal approval and adherence to allowed_if conditions"
      remediation: "Verify conditions and approval before usage"
      severity: warn
      conditions:
        LGPL-2.1:
          - "Used as a dynamically linked library"
          - "No modifications to the licensed code"
          - "Legal approval required"
        BSD-4-Clause:
          - "S.3 Advertising requirement met"
        EPL-2.0:
          - "Component used without modification and kept in separate file"
        OFL-1.1:
          - "Use is internal or no modification or incorporation to source code"

  - description: Unknown licenses must be manually reviewed
    id: unknown_license
    when:
      license: NO-ASSERTION
    then:
      action: flag_for_review
      message: "Unknown license detected"
      severity: warn

